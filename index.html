<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DompetKu</title>
  <meta name="description" content="DompetKu adalah aplikasi pencatat keuangan pribadi untuk transaksi, hutang piutang, target tabungan, dan beberapa dompet.">
  <meta http-equiv="refresh" content="0; url=./dompetku.html">
  <link rel="canonical" href="./dompetku.html">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#2c7a7b">
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f4f8;
      color: #1a202c;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      max-width: 420px;
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      color: #2c7a7b;
      font-size: 32px;
    }
    p {
      margin: 0 0 18px;
      line-height: 1.6;
      color: #4a5568;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 12px;
      background: #2c7a7b;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
    @media (prefers-color-scheme: dark) {
      :root { background: #0f1117; color: #f0f4f8; }
      p { color: #a0aec0; }
    }
  </style>
  <script>
    window.location.replace('./dompetku.html');
  </script>
</head>
<body>
  <main>
    <h1>DompetKu</h1>
    <p>Membuka aplikasi pencatat keuangan pribadi.</p>
    <a href="./dompetku.html">Buka DompetKu</a>
  </main>
</body>
</html>
